<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fragancias 360 - Catálogo & Reservas</title>
    <style>
        :root {
            --primary-text: #ffffff;
            --secondary-text: #a1a1a6;
            --accent-gold: #fee082;
            --accent-gold-dark: #d4af37;
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #121214 100%);
            --card-bg: rgba(22, 22, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --modal-bg: rgba(20, 20, 22, 0.95);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-text-size-adjust: 100%;
        }
        
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            color: var(--primary-text); 
            min-height: 100vh; 
            padding-bottom: calc(80px + env(safe-area-inset-bottom)); 
            overflow-x: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-shape { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.6; pointer-events: none; }
        .shape1 { width: 300px; height: 300px; background: rgba(214, 175, 55, 0.08); top: -50px; left: -50px; }
        .shape2 { width: 250px; height: 250px; background: rgba(138, 43, 226, 0.05); bottom: 100px; right: -50px; }

        header { 
            position: sticky; 
            top: 0; 
            z-index: 90; 
            background: rgba(9, 9, 11, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px; 
            text-align: center; 
        }
        header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fee082 0%, #d4af37 50%, #a37c1e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { font-size: 13px; color: var(--secondary-text); margin-top: 5px; letter-spacing: 0.3px; }

        .filters-container {
            max-width: 800px;
            margin: 20px auto 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            border-color: var(--accent-gold);
        }

        .genre-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .genre-filters::-webkit-scrollbar {
            display: none;
        }

        .genre-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--secondary-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .genre-btn.active {
            background: var(--accent-gold);
            color: #000000;
            border-color: var(--accent-gold);
        }

        .catalog-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; max-width: 800px; margin: 0 auto; }
        
        .product-card { background: var(--card-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: 22px; padding: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
        .product-card:hover { transform: translateY(-3px); border-color: rgba(214, 175, 55, 0.3); box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6); }
        
        .product-image-container { width: 100%; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.04); border-radius: 14px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; }

        .product-genre-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--secondary-text); margin-bottom: 4px; letter-spacing: 0.5px; }
        .product-name { font-size: 15px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
        .product-price { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }

        .stock-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-align: center; margin-bottom: 12px; width: max-content; }
        .stock-high { background: rgba(48, 209, 88, 0.15); color: #30d158; }
        .stock-out { background: rgba(255, 69, 58, 0.15); color: #ff453a; }
        .out-of-stock-card { border-color: rgba(138, 43, 226, 0.25); }

        .btn-add-cart { background: var(--accent-gold); color: #000000; border: none; padding: 11px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: auto; transition: background 0.2s, transform 0.1s; text-transform: uppercase; letter-spacing: 0.2px; width: 100%; }
        .btn-reserve { background: #8a2be2; color: #ffffff; }

        .empty-catalog-state {
            grid-column: 1 / -1;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            max-width: 450px;
            margin: 20px auto;
        }
        .empty-catalog-icon { font-size: 40px; }
        .empty-catalog-title { font-size: 18px; font-weight: 700; color: #ffffff; }
        .empty-catalog-text { font-size: 14px; color: var(--secondary-text); line-height: 1.5; }
        .btn-contact-seller { background: #25D366; color: #ffffff; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); transition: transform 0.2s; }
        .btn-contact-seller:hover { transform: translateY(-2px); }

        .cart-floating-btn { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; background: #ffffff; color: #1c1c1e; padding: 16px 22px; border-radius: 30px; font-weight: 700; box-shadow: 0 12px 35px rgba(0,0,0,0.6); z-index: 100; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: transform 0.2s; }
        .cart-badge { background: #1c1c1e; color: #ffffff; font-size: 12px; padding: 3px 9px; border-radius: 12px; font-weight: 700; }

        .cart-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: var(--modal-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: -15px 0 40px rgba(0,0,0,0.5); z-index: 200; transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; border-left: 1px solid rgba(255, 255, 255, 0.08); }
        .cart-modal.open { right: 0; }
        
        .cart-header { padding: calc(24px + env(safe-area-inset-top)) 20px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 20px; font-weight: 700; }
        .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--secondary-text); padding: 5px; }

        .cart-items-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .cart-item-info h4 { font-size: 15px; font-weight: 600; }
        .badge-reserve-inline { background: #8a2be2; color: white; font-size: 10px; padding: 2px 6px; border-radius: 6px; margin-left: 5px; font-weight: bold; }
        
        .cart-item-actions { display: flex; align-items: center; gap: 12px; }
        .cart-item-actions button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); width: 30px; height: 30px; border-radius: 50%; font-weight: 600; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .delivery-section { padding: 0 0 15px 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 15px; }
        .delivery-title { font-size: 14px; font-weight: 600; color: var(--secondary-text); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .delivery-options { display: flex; flex-direction: column; gap: 10px; }
        .delivery-label { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; transition: border-color 0.2s; }
        .delivery-label input { accent-color: var(--accent-gold); width: 18px; height: 18px; }
        .delivery-label:has(input:checked) { border-color: var(--accent-gold); background: rgba(214, 175, 55, 0.05); }

        .cart-footer { padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(15,15,17,0.6); }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 19px; font-weight: 700; margin-bottom: 18px; }
        .btn-checkout { background: #25D366; color: white; border: none; width: 100%; padding: 15px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); }
        .btn-checkout:disabled { background: #3a3a3c; color: #8e8e93; box-shadow: none; cursor: not-allowed; }

        .detail-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 92%; max-width: 500px; max-height: 85vh; background: var(--modal-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 28px; z-index: 250; opacity: 0; pointer-events: none; transition: transform 0.3s ease, opacity 0.3s ease; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .detail-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .detail-header { padding: 16px 20px; display: flex; justify-content: flex-end; position: absolute; width: 100%; top: 0; left: 0; z-index: 10; }
        .detail-body { padding: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; margin-top: 30px; }
        
        .detail-main-info { display: grid; grid-template-columns: 120px 1fr; gap: 16px; margin-bottom: 20px; }
        .detail-image { width: 120px; height: 120px; background: rgba(255,255,255,0.04); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .detail-price { font-size: 22px; font-weight: 800; color: var(--accent-gold); margin-bottom: 6px; }
        
        .detail-description-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--secondary-text); margin-bottom: 6px; letter-spacing: 0.5px; }
        .detail-description-text { font-size: 14px; line-height: 1.5; color: #e5e5ea; margin-bottom: 16px; background: rgba(255,255,255,0.03); padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }

        .notes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }
        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: #e5e5ea;
        }
        .note-item strong {
            color: var(--accent-gold);
            display: inline-block;
            margin-right: 6px;
        }

        .global-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 150; display: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .global-overlay.open { display: block; }
        .global-overlay.detail-z { z-index: 240; }
    </style>
</head>
<body>

    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <header>
        <h1>Fragancias 360</h1>
        <p>Catálogo de Perfumes e Inventario con Reservas</p>
    </header>

    <div class="filters-container">
        <input type="text" id="search-input" class="search-bar" placeholder="Buscar por nombre o fragancia...">
        <div class="genre-filters" id="genre-filters">
            <button class="genre-btn active" data-genre="Todos">Todos</button>
            <button class="genre-btn" data-genre="Masculino">Masculino</button>
            <button class="genre-btn" data-genre="Femenino">Femenino</button>
            <button class="genre-btn" data-genre="Unisex">Unisex</button>
        </div>
    </div>

    <main class="catalog-container" id="catalog">
        <p style="text-align:center; width:100%; color: var(--secondary-text);">Cargando catálogo...</p>
    </main>

    <div class="cart-floating-btn" id="cart-btn">
        <span>Mi Pedido</span>
        <span class="cart-badge" id="cart-badge-count">0</span>
    </div>

    <div class="global-overlay" id="global-overlay"></div>

    <!-- MODAL DE ALERTA PERSONALIZADA -->
    <div class="global-overlay" id="alert-overlay"></div>
    <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 320px; background: var(--modal-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 28px; text-align: center; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);" id="alert-modal">
        <div id="alert-icon" style="font-size: 32px; height: 40px; display: flex; align-items: center; justify-content: center;">✅</div>
        <div id="alert-message" style="font-size: 15px; line-height: 1.5; color: #e5e5ea;"></div>
        <button id="alert-btn-ok" style="background: var(--accent-gold); color: #000000; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; text-transform: uppercase; letter-spacing: 0.2px;">OK</button>
    </div>

    <!-- MODAL DE PROMPT PERSONALIZADO -->
    <div class="global-overlay" id="prompt-overlay"></div>
    <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 360px; background: var(--modal-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);" id="prompt-modal">
        <div id="prompt-title" style="font-size: 16px; font-weight: 700; color: #ffffff;"></div>
        <input type="text" id="prompt-input" placeholder="Escribe aquí..." style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255, 255, 255, 0.12); padding: 12px 14px; border-radius: 12px; color: #ffffff; font-size: 14px; font-family: inherit; transition: border-color 0.2s; outline: none;">
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <button id="prompt-btn-cancel" style="flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 12px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; color: #e5e5ea; transition: background 0.2s; text-transform: uppercase;">Cancelar</button>
            <button id="prompt-btn-ok" style="flex: 1; background: var(--accent-gold); color: #000000; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s; text-transform: uppercase;">OK</button>
        </div>
    </div>

    <div class="detail-modal" id="detail-modal">
        <div class="detail-header">
            <button class="close-btn" id="detail-close">✕</button>
        </div>
        <div class="detail-body" id="detail-body-content"></div>
    </div>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <button class="close-btn" id="cart-close">✕</button>
        </div>
        <div class="cart-items-container">
            <div id="cart-items"></div>
        </div>
        <div class="cart-footer">
            <div class="delivery-section">
                <div class="delivery-title">Método de entrega</div>
                <div class="delivery-options">
                    <label class="delivery-label">
                        <input type="radio" name="delivery" value="retiro" checked>
                        <span>Retirar gratis en dirección del vendedor</span>
                    </label>
                    <label class="delivery-label">
                        <input type="radio" name="delivery" value="envio">
                        <span>Pagar envío a domicilio</span>
                    </label>
                </div>
            </div>
            
            <div class="cart-total-row">
                <span>Total:</span>
                <span id="cart-total-val">$0</span>
            </div>
            <button class="btn-checkout" id="btn-pay" disabled>
                <span>✅ Confirmar Pedido</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtT22MM01MGoNosSBNHEdvKQlGu8ghIBQ",
            authDomain: "inventario-de-local.firebaseapp.com",
            databaseURL: "https://inventario-de-local-default-rtdb.firebaseio.com",
            projectId: "inventario-de-local",
            storageBucket: "inventario-de-local.firebasestorage.app",
            messagingSenderId: "535105215340",
            appId: "1:535105215340:web:47fcd308f64297b1c23149"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const perfumesRef = ref(db, "perfumes");

        let dbInventory = {}; 
        let cart = {};
        let currentSearchQuery = "";
        let currentGenreFilter = "Todos";

        const cartBtn = document.getElementById('cart-btn');
        const cartModal = document.getElementById('cart-modal');
        const detailModal = document.getElementById('detail-modal');
        const globalOverlay = document.getElementById('global-overlay');
        const cartClose = document.getElementById('cart-close');
        const detailClose = document.getElementById('detail-close');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalVal = document.getElementById('cart-total-val');
        const cartBadgeCount = document.getElementById('cart-badge-count');
        const btnPay = document.getElementById('btn-pay');
        const detailBodyContent = document.getElementById('detail-body-content');
        const searchInput = document.getElementById('search-input');
        const genreFiltersContainer = document.getElementById('genre-filters');

        // ====== SISTEMA DE CARTELES PERSONALIZADOS ======
        const alertModal = document.getElementById('alert-modal');
        const alertOverlay = document.getElementById('alert-overlay');
        const alertIcon = document.getElementById('alert-icon');
        const alertMessage = document.getElementById('alert-message');
        const alertBtnOk = document.getElementById('alert-btn-ok');
        
        const promptModal = document.getElementById('prompt-modal');
        const promptOverlay = document.getElementById('prompt-overlay');
        const promptTitle = document.getElementById('prompt-title');
        const promptInput = document.getElementById('prompt-input');
        const promptBtnOk = document.getElementById('prompt-btn-ok');
        const promptBtnCancel = document.getElementById('prompt-btn-cancel');

        function showAlert(message, icon = '✅') {
            return new Promise((resolve) => {
                alertIcon.textContent = icon;
                alertMessage.textContent = message;
                alertModal.style.opacity = '1';
                alertModal.style.pointerEvents = 'auto';
                alertOverlay.style.display = 'block';
                alertBtnOk.onclick = () => {
                    alertModal.style.opacity = '0';
                    alertModal.style.pointerEvents = 'none';
                    alertOverlay.style.display = 'none';
                    resolve();
                };
            });
        }

        function showPrompt(title, placeholderText = "Escribe aquí...") {
            return new Promise((resolve) => {
                promptTitle.textContent = title;
                promptInput.placeholder = placeholderText;
                promptInput.value = '';
                promptModal.style.opacity = '1';
                promptModal.style.pointerEvents = 'auto';
                promptOverlay.style.display = 'block';
                promptInput.focus();
                
                const handleOk = () => {
                    const value = promptInput.value.trim();
                    promptModal.style.opacity = '0';
                    promptModal.style.pointerEvents = 'none';
                    promptOverlay.style.display = 'none';
                    cleanupListeners();
                    resolve(value);
                };
                
                const handleCancel = () => {
                    promptModal.style.opacity = '0';
                    promptModal.style.pointerEvents = 'none';
                    promptOverlay.style.display = 'none';
                    cleanupListeners();
                    resolve(null);
                };
                
                const handleKeyPress = (e) => {
                    if (e.key === 'Enter') handleOk();
                    if (e.key === 'Escape') handleCancel();
                };
                
                const cleanupListeners = () => {
                    promptBtnOk.onclick = null;
                    promptBtnCancel.onclick = null;
                    promptInput.removeEventListener('keypress', handleKeyPress);
                };
                
                promptBtnOk.onclick = handleOk;
                promptBtnCancel.onclick = handleCancel;
                promptInput.addEventListener('keypress', handleKeyPress);
            });
        }

        const openCart = () => {
            cartModal.classList.add('open');
            globalOverlay.classList.add('open');
            globalOverlay.classList.remove('detail-z');
        };
        const closeAllModales = () => {
            cartModal.classList.remove('open');
            detailModal.classList.remove('open');
            globalOverlay.classList.remove('open');
            globalOverlay.classList.remove('detail-z');
        };

        cartBtn.addEventListener('click', openCart);
        cartClose.addEventListener('click', closeAllModales);
        detailClose.addEventListener('click', closeAllModales);
        globalOverlay.addEventListener('click', closeAllModales);

        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            renderCatalog();
        });

        genreFiltersContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('genre-btn')) {
                document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentGenreFilter = e.target.getAttribute('data-genre');
                renderCatalog();
            }
        });

        onValue(perfumesRef, (snapshot) => {
            if (!snapshot.exists()) {
                dbInventory = {};
                renderCatalog();
                validateCartStock();
                return;
            }

            dbInventory = snapshot.val();
            renderCatalog();
            validateCartStock();
            
            if (detailModal.classList.contains('open') && window.amp_currentDetailId) {
                window.amp_openDetail(window.amp_currentDetailId, true);
            }
        }, (error) => {
            console.error("Error al conectar con Firebase:", error);
            document.getElementById('catalog').innerHTML = `<p style="text-align:center; width:100%; color: #ff453a;">⚠️ Error de conexión: ${error.message}</p>`;
        });

        function renderCatalog() {
            const catalogContainer = document.getElementById('catalog');
            catalogContainer.innerHTML = ''; 

            const keys = Object.keys(dbInventory);

            if (keys.length === 0) {
                catalogContainer.innerHTML = `
                    <div class="empty-catalog-state">
                        <div class="empty-catalog-icon">✨</div>
                        <div class="empty-catalog-title">¡Catálogo en actualización!</div>
                        <div class="empty-catalog-text">Actualmente no tenemos perfumes cargados en el sistema. Si buscas alguna fragancia en específico o deseas consultar stock, comunícate directamente con nosotros.</div>
                        <a href="https://wa.me/59898324329?text=Hola,%20quisiera%20consultar%20por%20perfumes%20disponibles" target="_blank" class="btn-contact-seller">
                            💬 Comunicarse por WhatsApp
                        </a>
                    </div>
                `;
                return;
            }

            let totalMostrado = 0;

            keys.forEach((id) => {
                const perfume = dbInventory[id];
                const matchesSearch = perfume.nombre.toLowerCase().includes(currentSearchQuery.toLowerCase());
                const matchesGenre = currentGenreFilter === "Todos" || perfume.genero === currentGenreFilter;

                if (matchesSearch && matchesGenre) {
                    totalMostrado++;
                    let stockHtml = '';
                    let buttonText = 'Agregar';
                    let buttonClass = 'btn-add-cart';
                    let cardClass = 'product-card';

                    if (perfume.stock > 0) {
                        stockHtml = `<div class="stock-badge stock-high">Stock: ${perfume.stock} disp.</div>`;
                        buttonText = 'Agregar';
                        buttonClass = 'btn-add-cart';
                    } else {
                        stockHtml = `
                            <div style="margin-bottom: 12px;">
                                <div class="stock-badge stock-out" style="margin-bottom: 4px;">Agotado</div>
                                <p style="font-size: 12px; color: #b163ff; font-weight: 600; font-style: italic;">¿Deseas reservar el tuyo?</p>
                            </div>
                        `;
                        buttonText = 'Reservar';
                        buttonClass = 'btn-add-cart btn-reserve';
                        cardClass += ' out-of-stock-card';
                    }

                    const imagenSrc = perfume.fotoUrl ? perfume.fotoUrl : 'https://via.placeholder.com/300?text=Sin+Foto';
                    const generoTexto = perfume.genero || "General";

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="product-image-container" onclick="window.amp_openDetail('${id}')">
                            <img src="${imagenSrc}" alt="${perfume.nombre}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Error+Enlace';">
                        </div>
                        <div onclick="window.amp_openDetail('${id}')">
                            <div class="product-genre-tag">${generoTexto}</div>
                            <h2 class="product-name">${perfume.nombre}</h2>
                            <div class="product-price">$${perfume.precio}</div>
                            ${stockHtml}
                        </div>
                        <button class="${buttonClass}" data-id="${id}">
                            ${buttonText}
                        </button>
                    `;
                    catalogContainer.appendChild(card);
                }
            });

            if (totalMostrado === 0) {
                catalogContainer.innerHTML = '<p style="text-align:center; width:100%; color: var(--secondary-text);">Ningún perfume coincide con la búsqueda o categoría seleccionada.</p>';
                return;
            }

            document.querySelectorAll('#catalog .btn-add-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(btn.getAttribute('data-id'));
                });
            });
        }

        window.amp_currentDetailId = null;
        window.amp_openDetail = function(id, isRefresh = false) {
            window.amp_currentDetailId = id;
            const perfume = dbInventory[id];
            if (!perfume) return;

            const imagenSrc = perfume.fotoUrl ? perfume.fotoUrl : 'https://via.placeholder.com/300?text=Sin+Foto';
            const descripcionText = perfume.descripcion ? perfume.descripcion : 'Fragancia de alta calidad perteneciente a la línea premium internacional.';
            
            // Extracción de las notas olfativas y stock con valores por defecto si no existen
            const stockDisp = perfume.stock !== undefined ? perfume.stock : 0;
            const notasSalida = perfume.notasSalida || perfume.notas_salida || 'No especificada';
            const notasscorazón = perfume.notasscorazón || perfume.notass_corazón || 'No especificadas';
            const notasFondo = perfume.notasFondo || perfume.notas_fondo || 'No especificada';

            let stockHtml = '', buttonText = 'Agregar al pedido', buttonClass = 'btn-add-cart';
            if (stockDisp > 0) { 
                stockHtml = `<div class="stock-badge stock-high">Stock disponible: ${stockDisp}</div>`; 
                buttonText = 'Agregar al pedido'; 
            } else { 
                stockHtml = `
                    <div>
                        <div class="stock-badge stock-out" style="margin-bottom: 2px;">Agotado (Stock: 0)</div>
                        <p style="font-size: 13px; color: #b163ff; font-weight: 600; font-style: italic; margin-bottom: 8px;">¿Deseas reservar el tuyo?</p>
                    </div>
                `; 
                buttonText = 'Reservar Producto'; 
                buttonClass += ' btn-reserve'; 
            }

            detailBodyContent.innerHTML = `
                <div class="detail-main-info">
                    <div class="detail-image">
                        <img src="${imagenSrc}" alt="${perfume.nombre}">
                    </div>
                    <div>
                        <div class="product-genre-tag">Género: ${perfume.genero || 'No especificado'}</div>
                        <h3 class="detail-title">${perfume.nombre}</h3>
                        <div class="detail-price">Precio: $${perfume.precio}</div>
                        ${stockHtml}
                    </div>
                </div>

                <div class="detail-description-title">Pirámide Olfativa</div>
                <div class="notes-grid">
                    <div class="note-item"><strong>notas de salida:</strong> ${notasSalida}</div>
                    <div class="note-item"><strong>notas de corazón:</strong> ${notasscorazón}</div>
                    <div class="note-item"><strong>notas de fondo:</strong> ${notasFondo}</div>
                </div>

                <div class="detail-description-title">Descripción</div>
                <div class="detail-description-text">${descripcionText}</div>
                
                <button class="${buttonClass}" id="modal-add-btn">
                    ${buttonText}
                </button>
            `;

            document.getElementById('modal-add-btn').addEventListener('click', () => addToCart(id));

            if (!isRefresh) {
                detailModal.classList.add('open');
                globalOverlay.classList.add('open');
                globalOverlay.classList.add('detail-z');
            }
        };

        function addToCart(id) {
            const maxAvailable = dbInventory[id]?.stock || 0;
            const currentInCart = cart[id]?.quantity || 0;

            if (maxAvailable === 0) {
                if (!cart[id]) {
                    cart[id] = {
                        nombre: dbInventory[id].nombre,
                        precio: dbInventory[id].precio,
                        quantity: 1,
                        esReserva: true
                    };
                } else {
                    cart[id].quantity += 1;
                }
                renderCart();
            } else if (currentInCart < maxAvailable) {
                if (!cart[id]) {
                    cart[id] = {
                        nombre: dbInventory[id].nombre,
                        precio: dbInventory[id].precio,
                        quantity: 1,
                        esReserva: false
                    };
                } else {
                    cart[id].quantity += 1;
                }
                renderCart();
            } else {
                showAlert("Has alcanzado el límite de stock disponible para envío inmediato. Puedes reservar si se agota.", "⚠️");
            }
        }

        window.amp_changeQuantity = function(id, change) {
            if (!cart[id]) return;
            const maxAvailable = dbInventory[id]?.stock || 0;
            const newQuantity = cart[id].quantity + change;

            if (newQuantity <= 0) {
                delete cart[id];
            } else if (cart[id].esReserva) {
                cart[id].quantity = newQuantity;
            } else if (newQuantity <= maxAvailable) {
                cart[id].quantity = newQuantity;
            } else {
                showAlert("Cantidad máxima de stock inmediato alcanzada.", "⚠️");
            }
            renderCart();
        };

        function validateCartStock() {
            let changesMade = false;
            Object.keys(cart).forEach(id => {
                const currentStock = dbInventory[id]?.stock || 0;
                if (currentStock === 0 && !cart[id].esReserva) {
                    cart[id].esReserva = true;
                    changesMade = true;
                } else if (currentStock > 0 && cart[id].esReserva) {
                    cart[id].esReserva = false;
                    changesMade = true;
                }
            });
            if (changesMade) renderCart();
        }

        function renderCart() {
            cartItemsContainer.innerHTML = '';
            let total = 0, totalItemsCount = 0;
            let reservasCount = 0, comprasCount = 0;

            Object.keys(cart).forEach(id => {
                const item = cart[id];
                const subtotal = item.precio * item.quantity;
                total += subtotal;
                totalItemsCount += item.quantity;

                if (item.esReserva) {
                    reservasCount++;
                } else {
                    comprasCount++;
                }

                const row = document.createElement('div');
                row.className = 'cart-item';
                const badge = item.esReserva ? '<span class="badge-reserve-inline">🔔 RESERVA</span>' : '<span style="background: #30d158; color: white; font-size: 10px; padding: 2px 6px; border-radius: 6px; margin-left: 5px; font-weight: bold;">✓ DISPONIBLE</span>';
                
                row.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.nombre} ${badge}</h4>
                        <p style="font-size: 13px;">$${item.precio} c/u • Subtotal: $${subtotal}</p>
                    </div>
                    <div class="cart-item-actions">
                        <button onclick="window.amp_changeQuantity('${id}', -1)">−</button>
                        <span style="min-width: 25px; text-align: center;">${item.quantity}</span>
                        <button onclick="window.amp_changeQuantity('${id}', 1)">+</button>
                    </div>
                `;
                cartItemsContainer.appendChild(row);
            });

            if (totalItemsCount === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; color:#86868b; margin-top:20px;">Tu carrito está vacío.</p>';
                btnPay.disabled = true;
            } else {
                btnPay.disabled = false;
                
                const summary = document.createElement('div');
                summary.style.cssText = 'padding: 16px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-top: 8px; font-size: 12px; color: #a1a1a6;';
                summary.innerHTML = `
                    <div style="display: flex; justify-content: space-between; gap: 10px;">
                        <span>📦 ${comprasCount} Disponibles</span>
                        <span>🔔 ${reservasCount} Reservas</span>
                    </div>
                `;
                cartItemsContainer.appendChild(summary);
            }

            cartTotalVal.innerText = `$${total.toLocaleString()}`;
            cartBadgeCount.innerText = totalItemsCount;
        }

        btnPay.addEventListener('click', async () => {
            if (Object.keys(cart).length === 0) return;

            const nombreCliente = await showPrompt("👤 Nombre Completo", "Ej: Juan García");
            if (nombreCliente === null) return;
            
            const nombreLimpio = nombreCliente.trim();
            if (nombreLimpio === "") {
                await showAlert("El nombre es obligatorio para completar el pedido.", "⚠️");
                return;
            }

            const telefonoCliente = await showPrompt("📱 Teléfono de Contacto", "Ej: 099123456");
            const telefonoLimpio = telefonoCliente ? telefonoCliente.trim() : "No especificado";

            btnPay.disabled = true;
            btnPay.innerText = "⏳ Registrando pedido...";

            try {
                const deliveryOption = document.querySelector('input[name="delivery"]:checked').value;
                const entregaTexto = deliveryOption === 'envio' ? "Envío a domicilio" : "Retirar gratis en dirección del vendedor";

                let items = [];
                let totalPedido = 0;
                let contieneReservas = false;

                for (const id of Object.keys(cart)) {
                    const itemComprado = cart[id];
                    const subtotal = itemComprado.precio * itemComprado.quantity;
                    totalPedido += subtotal;

                    items.push({
                        id: id,
                        nombre: itemComprado.nombre,
                        cantidad: itemComprado.quantity,
                        precio: itemComprado.precio,
                        subtotal: subtotal,
                        esReserva: itemComprado.esReserva
                    });

                    if (itemComprado.esReserva) {
                        contieneReservas = true;
                    } else {
                        const stockProductRef = ref(db, `perfumes/${id}/stock`);
                        await runTransaction(stockProductRef, (currentStock) => {
                            if (currentStock === null) return 0;
                            return Math.max(0, currentStock - itemComprado.quantity);
                        });
                    }
                }

                const reservasRef = ref(db, "reservas");
                const nuevaReservaRef = push(reservasRef);
                await set(nuevaReservaRef, {
                    cliente: nombreLimpio,
                    telefono: telefonoLimpio,
                    items: items,
                    total: totalPedido,
                    fecha: new Date().toISOString(),
                    metodoEntrega: entregaTexto,
                    estado: "Pendiente",
                    contieneReservas: contieneReservas
                });

                cart = {};
                renderCart();
                closeAllModales();

                await showAlert(`¡Pedido registrado exitosamente!\n\n👤 ${nombreLimmio || nombreLimpio}\n💰 Total: $${totalPedido.toLocaleString()}\n📱 ${telefonoLimpio}\n\nEl administrador se pondrá en contacto pronto.`, "✅");

            } catch (error) {
                await showAlert("Hubo un error registrando el pedido. Por favor, intenta nuevamente.", "❌");
                console.error(error);
            } finally {
                btnPay.disabled = false;
                btnPay.innerHTML = "<span>✅ Confirmar Pedido</span>";
            }
        });
    </script>
</body>
</html>
